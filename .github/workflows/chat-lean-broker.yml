name: Chat lease broker
on:
  push:
    branches: [chat-lean-broker]
    paths: [chat-broker/request.json]
permissions:
  contents: write
  statuses: write
concurrency:
  group: chat-lease-broker
  cancel-in-progress: false
jobs:
  broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=chat-lean-broker -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Manage bounded lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 chat-broker/broker.py
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in success) state=success;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=chat-lean-broker -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
