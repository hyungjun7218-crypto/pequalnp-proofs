name: Chat Lean check
on:
  push:
    branches: [chat-lean-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-lean-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -eu
          sh .github/scripts/install-elan.sh v4.4.0 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2 "$HOME/.elan" "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: lake exe cache get
      - name: Smoke test or check candidate
        shell: bash
        run: |
          set -eu
          cd lean
          lean --version
          if [ -f ../chat-check/candidate.lean ]; then
            lake env lean ../chat-check/candidate.lean
          else
            printf 'import Mathlib\nexample (n : Nat) : n + 0 = n := by simp\n' > "$RUNNER_TEMP/smoke.lean"
            lake env lean "$RUNNER_TEMP/smoke.lean"
          fi
